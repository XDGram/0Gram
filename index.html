<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0Gram</title>
  <style>
    :root {
      --bg-a: #ffffff;
      --bg-b: #f4f4f1;
      --bg-c: #ebe8e2;
      --shell: rgba(255,255,255,.78);
      --shell-border: rgba(20,20,20,.08);
      --track-a: #f7f7f4;
      --track-b: #d9d5cf;
      --knob-a: #ffffff;
      --knob-b: #ddd8d0;
      --warm: rgba(214, 175, 105, 0);
    }

    body.on {
      --bg-a: #f4efe7;
      --bg-b: #e5ddd1;
      --bg-c: #d6c8b7;
      --shell: rgba(255,248,238,.72);
      --shell-border: rgba(92,62,28,.10);
      --track-a: #2b2926;
      --track-b: #12110f;
      --knob-a: #f2d59a;
      --knob-b: #c48a2f;
      --warm: rgba(214, 175, 105, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.96), transparent 33%),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,.70), transparent 31%),
        linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 58%, var(--bg-c) 100%);
      transition: background 900ms cubic-bezier(.16,1,.3,1);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 84% 10%, var(--warm), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.018));
      transition: background 900ms cubic-bezier(.16,1,.3,1), opacity 900ms ease;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      perspective: 1400px;
      transform-style: preserve-3d;
    }

    .control-wrap {
      position: absolute;
      top: 28px;
      right: 30px;
      padding: 9px;
      border-radius: 999px;
      background: var(--shell);
      border: 1px solid var(--shell-border);
      box-shadow:
        0 22px 60px rgba(20, 18, 15, .07),
        0 5px 18px rgba(20,18,15,.05),
        inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      transition:
        background 650ms cubic-bezier(.16,1,.3,1),
        border-color 650ms cubic-bezier(.16,1,.3,1),
        box-shadow 650ms cubic-bezier(.16,1,.3,1);
    }

    .switch {
      width: 92px;
      height: 50px;
      position: relative;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      perspective: 900px;
      outline: none;
    }

    .switch:focus-visible .track {
      outline: 2px solid rgba(30,30,30,.28);
      outline-offset: 4px;
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--track-a), var(--track-b));
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.8),
        inset 0 -5px 10px rgba(0,0,0,.11),
        0 12px 24px rgba(0,0,0,.08);
      transform-origin: center;
      transform-style: preserve-3d;
      transition:
        transform 820ms cubic-bezier(.16,1,.3,1),
        background 650ms cubic-bezier(.16,1,.3,1),
        box-shadow 650ms cubic-bezier(.16,1,.3,1),
        opacity 420ms ease;
    }

    .track::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.44), rgba(255,255,255,.03));
      pointer-events: none;
    }

    .knob {
      position: absolute;
      width: 40px;
      height: 40px;
      top: 5px;
      left: 5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.92), transparent 24%),
        linear-gradient(180deg, var(--knob-a), var(--knob-b));
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.9),
        inset 0 -4px 8px rgba(0,0,0,.12),
        0 10px 18px rgba(0,0,0,.16),
        0 2px 5px rgba(0,0,0,.08);
      transform: translateX(0) translateZ(20px);
      transition:
        transform 820ms cubic-bezier(.16,1,.3,1),
        background 650ms cubic-bezier(.16,1,.3,1),
        box-shadow 650ms cubic-bezier(.16,1,.3,1);
    }

    .halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(219,165,75,.26), transparent 66%);
      filter: blur(16px);
      opacity: 0;
      transition: opacity 650ms ease;
      pointer-events: none;
    }

    body.on .track {
      transform: rotateY(-58deg) rotateX(8deg);
    }

    body.on .knob {
      transform: translateX(42px) translateZ(20px);
    }

    body.on .halo {
      opacity: 1;
    }

    .fade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(255,255,255,.72);
      opacity: 0;
      transition: opacity 260ms ease;
    }

    .fade.active {
      opacity: 1;
    }

    @media (max-width: 640px) {
      .control-wrap {
        top: 20px;
        right: 20px;
      }

      .switch {
        width: 84px;
        height: 46px;
      }

      .knob {
        width: 36px;
        height: 36px;
      }

      body.on .knob {
        transform: translateX(38px) translateZ(20px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="control-wrap">
      <button class="switch" id="lightSwitch" type="button" aria-label="Toggle light" aria-pressed="false">
        <span class="track">
          <span class="halo"></span>
          <span class="knob"></span>
        </span>
      </button>
    </div>
    <div class="fade" id="fade"></div>
  </main>

  <script>
    const button = document.getElementById("lightSwitch");
    const fade = document.getElementById("fade");

    button.addEventListener("click", () => {
      fade.classList.add("active");

      window.setTimeout(() => {
        document.body.classList.toggle("on");
        const active = document.body.classList.contains("on");
        button.setAttribute("aria-pressed", String(active));
      }, 120);

      window.setTimeout(() => {
        fade.classList.remove("active");
      }, 260);
    });
  </script>
</body>
</html>
